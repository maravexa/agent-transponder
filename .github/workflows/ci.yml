# .github/workflows/ci.yml
# Agent Transponder — Full CI/CD Pipeline
# Publication trust boundaries and gate policy: docs/ci-security.md
#
# Triggers:
#   - Push to main: build + sign + push images
#   - Pull request: lint + test + build (no push)
#   - Tag v*: full release via GoReleaser

name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Validate stacked review branches with the same unprivileged jobs.
  pull_request:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}/agent-transponder
  GO_VERSION: "1.26.9"
  PYTHON_VERSION: "3.13"

jobs:
  # ════════════════════════════════════════════
  # Stage 1: Lint & Static Analysis
  # ════════════════════════════════════════════

  lint-go:
    name: Lint Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.15.0
          install-mode: goinstall
          args: --timeout=5m

      - name: Go security lint (gosec)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          mkdir -p reports
          gosec -fmt=json -out=reports/gosec.json ./... || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: gosec-report
          path: reports/gosec.json

  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linters
        run: pip install ruff==0.16.5 bandit

      - name: Ruff check + format
        run: |
          ruff check sdk/
          ruff format --check sdk/

      - name: Bandit security scan
        run: |
          mkdir -p reports
          bandit -r sdk/ -f json -o reports/bandit.json || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: bandit-report
          path: reports/bandit.json

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: semgrep scan --config=auto --json -o reports/semgrep.json .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: semgrep-report
          path: reports/semgrep.json

  # ════════════════════════════════════════════
  # Stage 2: Test
  # ════════════════════════════════════════════

  test-go:
    name: Test Go
    runs-on: ubuntu-latest
    needs: [lint-go]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests with race detector
        run: |
          mkdir -p reports
          go test -race -coverprofile=reports/coverage.out -covermode=atomic -v ./...

      - name: Coverage report
        run: go tool cover -func=reports/coverage.out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-coverage
          path: reports/coverage.out

  test-python:
    name: Test Python
    runs-on: ubuntu-latest
    needs: [lint-python]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e sdk/[test]

      - name: Run SDK tests
        run: cd sdk && python -m pytest tests/ -v --tb=short --junitxml=../reports/sdk-tests.xml

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: python-test-results
          path: reports/*.xml

  # ════════════════════════════════════════════
  # Stage 3: Build Container Images
  # Build and scan archives with read-only permissions before publication.
  # ════════════════════════════════════════════

  build-images:
    name: Build & Scan (${{ matrix.component }}, ${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: [test-go, test-python, semgrep, lint-ansible]
    permissions:
      contents: read
    strategy:
      matrix:
        component: [ingestion, exporter, analyzer]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Install pinned Cosign
        run: bash scripts/ci/install-cosign.sh
      - name: Install verified Grype
        run: bash scripts/ci/install-grype.sh
      - name: Build local archive (never push)
        id: build
        env:
          BUILDX_METADATA_PROVENANCE: min
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: deploy/docker/Dockerfile.${{ matrix.component }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          push: false
          provenance: false
          tags: local/agent-transponder:${{ matrix.component }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.arch }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
      - name: Retain and validate BuildKit provenance
        env:
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
          ARCH: ${{ matrix.arch }}
        run: |
          printf '%s\n' "$BUILD_METADATA" > "$RUNNER_TEMP/metadata.json"
          image_id=$(python3 scripts/ci/image-id.py "$RUNNER_TEMP/image.tar" "$ARCH")
          python3 scripts/ci/prepare-provenance.py "$RUNNER_TEMP/metadata.json" "$image_id" "$RUNNER_TEMP/provenance.json"
      - name: Scan exact archive
        run: bash scripts/ci/scan-image.sh "$RUNNER_TEMP/image.tar" "$RUNNER_TEMP/reports"
      - name: Retain scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: grype-${{ matrix.component }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/reports/
      - name: Retain scanned image for publication
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-${{ matrix.component }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/image.tar
            ${{ runner.temp }}/image.sha256
            ${{ runner.temp }}/metadata.json
          if-no-files-found: error
          retention-days: 2

  publish-images:
    name: Publish Scanned Images (${{ matrix.component }})
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        component: [ingestion, exporter, analyzer]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-${{ matrix.component }}-amd64
          path: images/amd64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-${{ matrix.component }}-arm64
          path: images/arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Install pinned Cosign
        run: bash scripts/ci/install-cosign.sh
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          syft-version: v1.54.1
      - name: Publish, sign and attest scanned images
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.component }}
          COMPONENT: ${{ matrix.component }}
          COMMIT: ${{ github.sha }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: bash scripts/ci/publish-images.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ matrix.component }}
          path: sbom/

  lint-ansible:
    name: Lint Ansible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install ansible-lint
        run: pip install ansible-lint

      - name: Test CI security boundaries
        run: python3 scripts/ci/test_security.py

      - name: Run ansible-lint
        run: cd ansible && ansible-lint roles/ site.yml local.yml

  # ════════════════════════════════════════════
  # Stage 5: Release (tag push only)
  # ════════════════════════════════════════════

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [publish-images]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write       # Create GitHub release
      id-token: write       # Keyless signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0    # GoReleaser needs full history for changelog

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Preserve the existing GoReleaser detached-signature interface.
      - name: Install release signer
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v2.5.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          syft-version: v1.54.1

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}

      # Download SBOMs from build stage and attach to release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: sbom-*
          merge-multiple: true
          path: sbom/

      - name: Attach SBOMs to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$RELEASE_TAG" sbom/*.json --clobber
