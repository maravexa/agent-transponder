# .github/workflows/ci.yml
# Agent Transponder — Full CI/CD Pipeline
#
# Triggers:
#   - Push to main: build + sign + push images
#   - Pull request: lint + test + build (no push)
#   - Tag v*: full release via GoReleaser

name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}/agent-transponder
  GO_VERSION: "1.25"
  PYTHON_VERSION: "3.12"

jobs:
  # ════════════════════════════════════════════
  # Stage 1: Lint & Static Analysis
  # ════════════════════════════════════════════

  lint-go:
    name: Lint Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          args: --timeout=5m

      - name: Go security lint (gosec)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -fmt=json -out=reports/gosec.json ./... || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gosec-report
          path: reports/gosec.json

  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linters
        run: pip install ruff bandit

      - name: Ruff check + format
        run: |
          ruff check sdk/ analysis/
          ruff format --check sdk/ analysis/

      - name: Bandit security scan
        run: |
          mkdir -p reports
          bandit -r sdk/ analysis/ -f json -o reports/bandit.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: reports/bandit.json

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config=auto --json -o reports/semgrep.json .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: reports/semgrep.json

  # ════════════════════════════════════════════
  # Stage 2: Test
  # ════════════════════════════════════════════

  test-go:
    name: Test Go
    runs-on: ubuntu-latest
    needs: [lint-go]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests with race detector
        run: |
          mkdir -p reports
          go test -race -coverprofile=reports/coverage.out -covermode=atomic -v ./...

      - name: Coverage report
        run: go tool cover -func=reports/coverage.out

      - uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: reports/coverage.out

  test-python:
    name: Test Python
    runs-on: ubuntu-latest
    needs: [lint-python]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -e sdk/[test]
          pip install -e analysis/[test]

      - name: Run SDK tests
        run: cd sdk && python -m pytest tests/ -v --tb=short --junitxml=../reports/sdk-tests.xml

      - name: Run analysis tests
        run: cd analysis && python -m pytest tests/ -v --tb=short --junitxml=../reports/analysis-tests.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-test-results
          path: reports/*.xml

  # ════════════════════════════════════════════
  # Stage 3: Build Container Images
  # ════════════════════════════════════════════

  build-images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [test-go, test-python, semgrep]
    permissions:
      contents: read
      packages: write       # Push to GHCR
      id-token: write       # Keyless signing via Sigstore
    strategy:
      matrix:
        component: [ingestion, exporter, analysis]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.${{ matrix.component }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}

      # ── Sign with cosign (keyless / Sigstore) ──
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ matrix.component }}@${DIGEST}

      # ── Generate SBOM ──
      - name: Install syft
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p sbom
          syft ${{ env.REGISTRY }}/${{ matrix.component }}@${DIGEST} \
            -o spdx-json=sbom/${{ matrix.component }}.spdx.json \
            -o cyclonedx-json=sbom/${{ matrix.component }}.cdx.json

      - name: Attest SBOM
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign attest --yes \
            --predicate sbom/${{ matrix.component }}.spdx.json \
            --type spdxjson \
            ${{ env.REGISTRY }}/${{ matrix.component }}@${DIGEST}

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: sbom-${{ matrix.component }}
          path: sbom/

  # ════════════════════════════════════════════
  # Stage 4: Vulnerability Scan
  # ════════════════════════════════════════════

  vuln-scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: read
      security-events: write  # Upload to GitHub Security tab
    strategy:
      matrix:
        component: [ingestion, exporter, analysis]
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install grype
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan for vulnerabilities
        run: |
          grype ${{ env.REGISTRY }}/${{ matrix.component }}:sha-${GITHUB_SHA::7} \
            --fail-on high \
            -o table \
            -o sarif=${{ matrix.component }}-grype.sarif

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ matrix.component }}-grype.sarif
          category: grype-${{ matrix.component }}

  # ════════════════════════════════════════════
  # Stage 5: Release (tag push only)
  # ════════════════════════════════════════════

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [vuln-scan]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write       # Create GitHub release
      packages: write       # Push to GHCR
      id-token: write       # Keyless signing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # GoReleaser needs full history for changelog

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}

      # Download SBOMs from build stage and attach to release
      - uses: actions/download-artifact@v4
        with:
          pattern: sbom-*
          merge-multiple: true
          path: sbom/

      - name: Attach SBOMs to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} sbom/*.json --clobber
