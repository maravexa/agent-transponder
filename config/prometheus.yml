global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "agent-transponder-ingestion"
    static_configs:
      - targets: ["ingestion:9090"]
    metrics_path: /metrics

  - job_name: "agent-transponder-exporter"
    static_configs:
      - targets: ["exporter:9091"]
    metrics_path: /metrics
