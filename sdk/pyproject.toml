[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-transponder-sdk"
version = "0.1.0"
description = "Agent Transponder Python SDK"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.65.0",
    "grpcio-tools>=1.65.0",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3,<2.0"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_transponder*", "agenttransponder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
