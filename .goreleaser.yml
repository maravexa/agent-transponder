# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: agent-transponder

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: at-ingestion
    main: ./cmd/ingestion/
    binary: at-ingestion
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -buildid=
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.buildTime={{.Date}}
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: at-exporter
    main: ./cmd/exporter/
    binary: at-exporter
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -buildid=
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.buildTime={{.Date}}
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: at-analyzer
    main: ./cmd/analyzer/
    binary: at-analyzer
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -buildid=
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.buildTime={{.Date}}
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: binaries
    formats: ["tar.gz"]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - SECURITY.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Sigstore keyless signing for binaries
signs:
  - cmd: cosign
    args:
      - "sign-blob"
      - "--yes"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
    artifacts: checksum

# Container images are built, scanned and published once by ci.yml.
# GoReleaser publishes signed binary archives only.

# SBOM generation for binary archives
sboms:
  - id: binary-sboms
    artifacts: archive
    cmd: syft
    args: ["${artifact}", "--output", "spdx-json=${document}"]
    documents:
      - "{{ .ArtifactName }}.spdx.json"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
  groups:
    - title: "Security"
      regexp: '^.*?(sec|vuln|cve|security).*$'
      order: 0
    - title: "Features"
      regexp: '^.*?feat.*$'
      order: 1
    - title: "Bug Fixes"
      regexp: '^.*?fix.*$'
      order: 2

release:
  github:
    owner: "{{ .Env.GITHUB_USER }}"
    name: agent-transponder
  prerelease: auto
  draft: false
