---
# ---------------------------------------------------------------------------
# Vars for the monitoring group (Prometheus + Grafana + node_exporter nodes).
# ---------------------------------------------------------------------------

# Prometheus configuration.
prometheus_listen_port: 9090
prometheus_scrape_interval: "15s"
prometheus_eval_interval: "15s"
prometheus_retention: "30d"

# Grafana configuration.
grafana_listen_port: 3000
grafana_admin_user: admin
grafana_admin_password: "{{ vault_grafana_admin_password | default('admin') }}"

# Prometheus datasource target (same host in single-node dev/staging).
grafana_prometheus_target_host: "localhost"

# Ports to open in the firewall for the monitoring group.
# This overrides the hardening role default (which only opens SSH).
# SSH must be included here to avoid being locked out.
hardening_firewall_open_ports:
  - { port: 22,   proto: tcp, comment: "ssh" }
  - { port: 9090, proto: tcp, comment: "prometheus" }
  - { port: 3000, proto: tcp, comment: "grafana" }
  - { port: 9100, proto: tcp, comment: "node_exporter" }
