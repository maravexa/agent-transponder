---
# ---------------------------------------------------------------------------
# Vars for the flight_recorder group (ingester, analyzer, exporter nodes).
# ---------------------------------------------------------------------------

# Binary artifact directory on the controller (relative to repo root).
fr_dist_dir: "{{ playbook_dir }}/../dist"

# Ingestion API listen addresses.
# fr_ingester_listen_addr: "0.0.0.0:8443"
# fr_ingester_health_addr: "0.0.0.0:8081"
# fr_ingester_metrics_addr: "0.0.0.0:8082"

# Analysis engine gRPC address.
# fr_analyzer_grpc_addr: "0.0.0.0:8420"

# Metrics exporter listen address.
# fr_exporter_listen_addr: "0.0.0.0:8430"

# HMAC shared secret (vault-encrypted in production).
# fr_ingester_hmac_secret: "{{ vault_ingester_hmac_secret }}"

# Ports to open in the firewall for flight recorder nodes.
# Variable name must be hardening_firewall_open_ports — that is what nftables.conf.j2 iterates.
hardening_firewall_open_ports:
  - { port: 8443, proto: tcp, comment: "ingester gRPC (mTLS)" }
  - { port: 8081, proto: tcp, comment: "ingester health" }
  - { port: 8082, proto: tcp, comment: "ingester metrics" }
  - { port: 8420, proto: tcp, comment: "analyzer" }
  - { port: 8430, proto: tcp, comment: "metrics exporter" }
