---
- name: Base configuration
  hosts: all
  become: true
  roles:
    - common
    - hardening
    - tls

- name: Monitoring stack
  hosts: monitoring
  become: true
  roles:
    - prometheus
    - grafana
    - node_exporter

# Application service roles — Phase 2c.
- name: Flight recorder services
  hosts: flight_recorder
  become: true
  roles:
    - ingester
    - analyzer
    - metrics_exporter
