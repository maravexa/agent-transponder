---
# smoke-test.yml — HTTP/HTTPS validation of the flight recorder stack.
# Run with: make smoke-test
# Requires: site.yml (or local.yml) to have been applied successfully first.
#
# NOTE: Full pipeline test (send event → analyze → export) requires a Go gRPC
# smoke test tool. Planned for a later phase.
- name: Flight recorder smoke test
  hosts: localhost
  connection: local
  become: true
  gather_facts: false

  tasks:
    # ── Ingester ─────────────────────────────────────────────────────────────

    - name: Verify ingester is healthy
      ansible.builtin.uri:
        url: "http://localhost:8081/healthz"
        status_code: [200]

    - name: Verify ingester metrics endpoint is reachable
      ansible.builtin.uri:
        url: "http://localhost:8082/metrics"
        return_content: true
        status_code: [200]
      register: _ingester_metrics

    - name: Verify ingester exposes Prometheus metrics
      ansible.builtin.assert:
        that: "'agent_transponder_' in _ingester_metrics.content"
        fail_msg: "Ingester metrics endpoint not serving agent_transponder_ metrics"

    # ── Analyzer ─────────────────────────────────────────────────────────────
    # Analyzer requires mTLS (RequireAndVerifyClientCert). Use the prometheus
    # cert — any cert signed by the internal CA satisfies the requirement.

    - name: Verify analyzer is healthy
      ansible.builtin.uri:
        url: "https://localhost:8420/health"
        ca_path: "{{ tls_ca_cert }}"
        client_cert: "{{ fr_tls_dir }}/prometheus/cert.pem"
        client_key: "{{ fr_tls_dir }}/prometheus/key.pem"
        status_code: [200]

    # ── Metrics Exporter ──────────────────────────────────────────────────────
    # Exporter uses VerifyClientCertIfGiven — client cert not required.

    - name: Verify metrics exporter is healthy
      ansible.builtin.uri:
        url: "https://localhost:8430/health"
        ca_path: "{{ tls_ca_cert }}"
        status_code: [200]

    - name: Verify metrics exporter serves Prometheus metrics
      ansible.builtin.uri:
        url: "https://localhost:8430/metrics"
        ca_path: "{{ tls_ca_cert }}"
        return_content: true
        status_code: [200]
      register: _exporter_metrics

    - name: Verify flight_recorder metrics are present
      ansible.builtin.assert:
        that: "'agent_transponder_' in _exporter_metrics.content"
        fail_msg: "Exporter metrics endpoint not serving agent_transponder_ metrics"

    # ── Prometheus ────────────────────────────────────────────────────────────
    # Prometheus web.yml sets client_auth_type: RequireAndVerifyClientCert.

    - name: Verify Prometheus is healthy
      ansible.builtin.uri:
        url: "https://localhost:9090/-/healthy"
        ca_path: "{{ tls_ca_cert }}"
        client_cert: "{{ fr_tls_dir }}/prometheus/cert.pem"
        client_key: "{{ fr_tls_dir }}/prometheus/key.pem"
        status_code: [200]

    # ── Grafana ───────────────────────────────────────────────────────────────
    # Grafana serves HTTPS but does not require client certs.

    - name: Verify Grafana is healthy
      ansible.builtin.uri:
        url: "https://localhost:3000/api/health"
        ca_path: "{{ tls_ca_cert }}"
        status_code: [200]

    # ── Node Exporter ─────────────────────────────────────────────────────────
    # Ubuntu 24.04 apt package runs plain HTTP — no TLS.

    - name: Verify node exporter is serving metrics
      ansible.builtin.uri:
        url: "http://localhost:9100/metrics"
        return_content: true
        status_code: [200]
      register: _node_metrics

    - name: Verify node exporter has CPU metrics
      ansible.builtin.assert:
        that: "'node_cpu_seconds_total' in _node_metrics.content"
        fail_msg: "Node exporter not serving expected metrics"

    # ── Prometheus Scrape Targets ─────────────────────────────────────────────

    - name: Query Prometheus for active targets
      ansible.builtin.uri:
        url: "https://localhost:9090/api/v1/targets"
        ca_path: "{{ tls_ca_cert }}"
        client_cert: "{{ fr_tls_dir }}/prometheus/cert.pem"
        client_key: "{{ fr_tls_dir }}/prometheus/key.pem"
        return_content: true
        status_code: [200]
      register: _targets

    - name: Verify Prometheus has scrape targets
      ansible.builtin.assert:
        that: "_targets.json.data.activeTargets | length > 0"
        fail_msg: "Prometheus has no active scrape targets"

    # ── Port Conflict Check ───────────────────────────────────────────────────

    - name: Verify no port conflicts (each port has exactly one listener)
      ansible.builtin.shell: |
        ss -tlnp | grep -c ':{{ item }} ' || true
      loop:
        - 8443
        - 8081
        - 8082
        - 8420
        - 8430
        - 9090
        - 9100
        - 3000
      register: _port_checks
      changed_when: false

    - name: Assert each port has at most one listener
      ansible.builtin.assert:
        that: "item.stdout | int <= 1"
        fail_msg: "Port conflict detected on port {{ item.item }}"
      loop: "{{ _port_checks.results }}"
      loop_control:
        label: "port {{ item.item }}"

    # ── Summary ───────────────────────────────────────────────────────────────

    - name: Print smoke test summary
      ansible.builtin.debug:
        msg: |
          ══════════════════════════════════════
          Smoke Test PASSED
          ══════════════════════════════════════
          Ingester: healthy (gRPC :8443, health :8081, metrics :8082)
          Analyzer: healthy (HTTPS :8420)
          Metrics Exporter: healthy (HTTPS :8430)
          Prometheus: healthy (HTTPS :9090)
          Grafana: healthy (HTTPS :3000)
          Node Exporter:    healthy (HTTP :9100)
          ──────────────────────────────────────
          NOTE: Full pipeline test (send event → analyze → export)
          requires a Go gRPC smoke test tool. Planned for a later phase.
          ══════════════════════════════════════
