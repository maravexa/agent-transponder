---
- name: Deploy hardened sshd_config
  ansible.builtin.template:
    src:   sshd_config.j2
    dest:  /etc/ssh/sshd_config
    owner: root
    group: root
    mode:  "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd

- name: Enable and start sshd
  ansible.builtin.service:
    name:    sshd
    enabled: true
    state:   started
