---
# Ubuntu 22.x-specific (linux-amd64): validate and copy the metrics-exporter binary from dist/.

- name: Check metrics-exporter binary exists on controller
  ansible.builtin.stat:
    path: "{{ fr_dist_dir }}/metrics-exporter"
  register: _exporter_binary
  delegate_to: localhost
  become: false

- name: Fail if metrics-exporter binary is missing
  ansible.builtin.fail:
    msg: "Binary not found at {{ fr_dist_dir }}/metrics-exporter. Run make build-all first."
  when: not _exporter_binary.stat.exists

- name: Copy metrics-exporter binary to target
  ansible.builtin.copy:
    src: "{{ fr_dist_dir }}/metrics-exporter"
    dest: "{{ fr_bin_dir }}/metrics-exporter"
    owner: root
    group: "{{ fr_group }}"
    mode: "0755"
  notify: Restart metrics-exporter
