---
- name: Create flight-recorder system group
  ansible.builtin.group:
    name: "{{ fr_group }}"
    system: true
    state: present

- name: Create flight recorder service accounts
  ansible.builtin.user:
    name: "{{ item.name }}"
    group: "{{ fr_group }}"
    home: "{{ item.home }}"
    comment: "{{ item.comment }}"
    shell: /sbin/nologin
    system: true
    create_home: true
    state: present
  loop: "{{ fr_users }}"

# ---------------------------------------------------------------------------
# Monitoring service users — created here (before the tls role runs) so that
# TLS key ownership tasks can reference them by name on the first playbook run.
# ---------------------------------------------------------------------------

- name: Create node_exporter system group
  ansible.builtin.group:
    name: node_exporter
    system: true
    state: present

- name: Create node_exporter system user
  ansible.builtin.user:
    name: node_exporter
    group: node_exporter
    groups: "{{ fr_group }}"
    append: true
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    comment: Prometheus node exporter
    state: present

- name: Ensure prometheus system user exists
  ansible.builtin.user:
    name: prometheus
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    comment: Prometheus monitoring system
    state: present

- name: Ensure grafana system user exists
  ansible.builtin.user:
    name: grafana
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    comment: Grafana dashboard service
    state: present
