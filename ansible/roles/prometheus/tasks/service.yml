---
- name: Remove legacy custom prometheus service unit (replaced by drop-in)
  ansible.builtin.file:
    path: /etc/systemd/system/prometheus.service
    state: absent
  notify: Restart prometheus

- name: Create Prometheus systemd service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/prometheus.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Template Prometheus systemd sandboxing drop-in
  ansible.builtin.template:
    src: prometheus-override.conf.j2
    dest: /etc/systemd/system/prometheus.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart prometheus

- name: Enable and start Prometheus service
  ansible.builtin.systemd:
    name: prometheus
    enabled: true
    state: started
    daemon_reload: true
