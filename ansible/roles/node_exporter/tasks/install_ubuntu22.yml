---
# Ubuntu 22.x-specific: install node_exporter from Ubuntu universe repository.
# The 'prometheus-node-exporter' package is available in Ubuntu 22.04 (Jammy) universe.
# Binary installs to /usr/bin/prometheus-node-exporter.
# Service is named prometheus-node-exporter.service.

- name: Install prometheus-node-exporter via apt
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present
    update_cache: true

- name: Create node_exporter system group
  ansible.builtin.group:
    name:   node_exporter
    system: true
    state:  present

- name: Create node_exporter system user
  ansible.builtin.user:
    name:        node_exporter
    group:       node_exporter
    groups:      "{{ fr_group }}"
    append:      true
    system:      true
    shell:       /usr/sbin/nologin
    create_home: false
    comment:     Prometheus node exporter

- name: Add node_exporter user to flight-recorder supplementary group
  ansible.builtin.user:
    name:   node_exporter
    groups: "{{ fr_group }}"
    append: true
