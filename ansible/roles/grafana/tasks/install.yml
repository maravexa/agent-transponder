---
# Debian/Ubuntu: add Grafana APT repo and install via package manager.
- name: Add Grafana APT GPG key (Debian/Ubuntu)
  ansible.builtin.apt_key:
    url: https://apt.grafana.com/gpg.key
    keyring: /usr/share/keyrings/grafana.gpg
    state: present
  when: ansible_os_family == "Debian"

- name: Add Grafana APT repository (Debian/Ubuntu)
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/grafana.gpg] https://apt.grafana.com stable main"
    filename: grafana
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

# RHEL/CentOS/Rocky: add Grafana YUM repo and install via package manager.
- name: Add Grafana RPM GPG key (RHEL family)
  ansible.builtin.rpm_key:
    key: https://rpm.grafana.com/gpg.key
    state: present
  when: ansible_os_family == "RedHat"

- name: Add Grafana YUM repository (RHEL family)
  ansible.builtin.yum_repository:
    name: grafana
    description: Grafana OSS
    baseurl: https://rpm.grafana.com
    gpgcheck: true
    gpgkey: https://rpm.grafana.com/gpg.key
    enabled: true
    repo_gpgcheck: true
    sslverify: true
    sslcacert: /etc/pki/tls/certs/ca-bundle.crt
  when: ansible_os_family == "RedHat"

- name: Install Grafana package at pinned version
  ansible.builtin.package:
    name: "grafana={{ grafana_version }}"
    state: present
  when: ansible_os_family == "Debian"

- name: Install Grafana package at pinned version (RHEL family)
  ansible.builtin.package:
    name: "grafana-{{ grafana_version }}"
    state: present
  when: ansible_os_family == "RedHat"

- name: Add grafana user to flight-recorder supplementary group
  ansible.builtin.user:
    name: grafana
    groups: "{{ fr_group }}"
    append: true

- name: Create Grafana provisioning subdirectories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: grafana
    group: grafana
    mode: "0750"
  loop:
    - /etc/grafana/provisioning/datasources
    - /etc/grafana/provisioning/dashboards
    - /var/lib/grafana/dashboards
